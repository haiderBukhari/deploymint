[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploymint-cli"
version = "0.1.0"
description = "Thin CLI client for a running DeployMint Docker Compose deployment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Haider Bukhari", email = "haider@ottooptics.io" }]

dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "websockets>=12.0",
  "rich>=13.7",
]

[project.scripts]
deploymint = "deploymint_cli:cli"

[tool.setuptools.packages.find]
include = ["deploymint_cli*"]
