[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploymint"
version = "0.1.0"
description = "AI agent swarm for secure deployment: reads your code, writes your configs, proves they're safe, deploys them. Runs as a self-hosted Docker Compose app."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Haider Bukhari", email = "haider@ottooptics.io" }]
keywords = ["devops", "kubernetes", "docker", "ai-agents", "security", "finops"]

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tree-sitter>=0.22",
  "tree-sitter-language-pack>=0.2",
  "networkx>=3.3",
  "docker>=7.0",
  "libtmux>=0.37",
  "anthropic>=0.69",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "scikit-learn>=1.5",
  "boto3>=1.34",
  "markdown>=3.6",
]

# checkov is a real dependency of the shipped image (Security Warden invokes it
# as a subprocess) but is deliberately NOT listed above: its stale `networkx<2.7`
# pin makes it unresolvable in the same pass as `networkx>=3.3` above. It is
# installed as a separate, ordered pip step in the Dockerfile instead — see
# docs/00-prerequisites.md §0.6 and docs/02-repo-layout.md §2.3.
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["deploymint*"]

[tool.setuptools.package-data]
deploymint = [
  "policies/*.rego",
  "data/*.json",
  "data/*.jsonl",
  "web/templates/*.html",
  "web/static/*",
  "web/static/vendor/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
  "S101",  # assert — used throughout tests, and a couple of load-bearing invariants
  "B008",  # FastAPI's Depends(get_db) in a default arg is the framework's own idiom
  "S104",  # binding 0.0.0.0 is required — this runs inside a container, not on a host
  "S110",  # deliberate "log to errors[], never raise" resilience pattern (see base.py)
  "S112",  # same pattern, in a loop (continue instead of pass)
]

[tool.ruff.lint.per-file-ignores]
# Tests shell out to docker/kubectl/checkov with fixed, hardcoded argv lists —
# not user-controlled input, so the "untrusted subprocess" rules don't apply.
# S105/S106: fake cloud credential strings used to test core/cloud_creds.py
# and core/terraform_exec.py — never real secrets.
"tests/*" = ["S603", "S607", "S108", "S105", "S106"]
# Embedded Dockerfile/YAML content as Python string literals — wrapping these
# fragments would fragment the generated artifact's own readability for no benefit.
"deploymint/agents/templates.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: requires the mounted docker socket",
  "llm: requires a real ANTHROPIC_API_KEY",
]
