{% extends "base.html" %}
{% block title %}Costs · DeployMint{% endblock %}
{% block content %}
<h1>Costs</h1>

<div class="card">
  <div class="section-label">Ask a question</div>
  <form id="cost-form" class="form">
    <input type="text" id="cost-question" placeholder="which service costs the most?">
    <button type="submit">Ask</button>
  </form>
  <p id="cost-answer" style="margin-bottom:0;"></p>
</div>

<div class="card">
  <div class="section-label">Breakdown</div>
  <table>
    <thead><tr><th>Service</th><th>Amount</th></tr></thead>
    <tbody id="cost-breakdown">
      {% for svc, amount in breakdown.items() %}
      <tr><td>{{ svc }}</td><td>${{ "%.2f"|format(amount) }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script src="/static/app.js"></script>
<script>wireCostForm();</script>
{% endblock %}
